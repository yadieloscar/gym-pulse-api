name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Regenerate docs
        run: swag init -g cmd/server/main.go --output docs

      - name: Fail if docs are out of date
        run: |
          git diff --exit-code docs/ || \
            (echo "Swagger docs are out of date — run 'swag init -g cmd/server/main.go --output docs' and commit the result." && exit 1)

      - name: Contract drift gate
        if: github.event_name == 'pull_request'
        run: |
          # If a PR changes validator tags, JSON field names, or handler
          # response shapes, docs/CONTRACTS.md must change in the same PR.
          # This is the bug class that cost us the most debug rounds:
          # client and API drifting apart silently.
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=50 2>/dev/null || true
          contract_touching=$(git diff "$base"...HEAD -- internal/model internal/handler \
            | grep -cE '^[+-].*(validate:|json:"|writeJSON)' || true)
          contracts_updated=$(git diff --name-only "$base"...HEAD | grep -c 'docs/CONTRACTS.md' || true)
          echo "contract-touching lines: $contract_touching; CONTRACTS.md updated: $contracts_updated"
          if [ "$contract_touching" -gt 0 ] && [ "$contracts_updated" -eq 0 ]; then
            echo "::error::This PR changes validator rules, JSON fields, or response shapes but does not update docs/CONTRACTS.md. Update the contract doc (or explain in it why the shape is unchanged) and re-push."
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11.4

      - name: Build
        run: go build ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Reachable vulnerability scan
        run: govulncheck ./...

      - name: Test (with coverage)
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -20

      - name: Coverage gate (>=90% package statement coverage)
        run: |
          # Preserve the existing 90% thresholds while measuring statement
          # coverage correctly. Averaging function percentages weights tiny
          # and large functions equally and can produce a false-green result.
          fail=0
          for pkg in service middleware handler router config; do
            profile="coverage-$pkg.out"
            go test "./internal/$pkg" -coverprofile="$profile" -covermode=atomic
            pct=$(go tool cover -func="$profile" \
              | awk '$1 == "total:" {gsub("%","",$3); print $3}')
            printf "  %-12s  %s%%\n" "$pkg" "$pct"
            awk -v v="$pct" 'BEGIN{exit !(v+0 >= 90)}' || { echo "  ↳ below 90%"; fail=1; }
          done
          [ "$fail" = "0" ] || exit 1

  container-scan:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build --tag gym-pulse-api:ci .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gym-pulse-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  smoke:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Boot API with JWKS disabled (HMAC test path)
        working-directory: ${{ github.workspace }}
        run: |
          # Smoke needs HMAC, not JWKS. Compose lives in the parent repo
          # directory in dev, but in CI we inline an override here.
          cat > docker-compose.ci.yml <<'YAML'
          services:
            db:
              image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
              environment:
                POSTGRES_DB: gympulse
                POSTGRES_USER: gympulse
                POSTGRES_PASSWORD: gympulse
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U gympulse -d gympulse"]
                interval: 3s
                retries: 10
            api:
              build: .
              environment:
                DATABASE_URL: postgres://gympulse:gympulse@db:5432/gympulse
                SUPABASE_JWT_SECRET: local-dev-secret-change-me
                SUPABASE_JWKS_URL: ""
                ENVIRONMENT: test
                LOG_LEVEL: warn
                # Proves the advisory-lock pool is independent. Account
                # deletion deadlocks here if it holds this only query
                # connection while trying to acquire a second one.
                DATABASE_MAX_CONNS: "1"
                DATABASE_MIN_CONNS: "0"
                DATABASE_LOCK_MAX_CONNS: "1"
              depends_on:
                db:
                  condition: service_healthy
              ports: ["8080:8080"]
          YAML
          docker compose -f docker-compose.ci.yml up -d --build
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { docker compose -f docker-compose.ci.yml logs api; exit 1; }

      - name: Seed smoke auth user
        run: |
          docker compose -f docker-compose.ci.yml exec -T db \
            psql -U gympulse -d gympulse -v ON_ERROR_STOP=1 \
            -c "INSERT INTO auth.users (id) VALUES ('00000000-0000-0000-0000-000000000001') ON CONFLICT (id) DO NOTHING;"

      - name: Run smoke
        run: ./scripts/smoke.sh

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
