openapi: 3.0.3
info: {title: GymPulse Sport Activities Contract (imported health workouts), version: 1.1.0}
paths:
  /api/v1/sport-activities:
    get:
      summary: List owned sport activities in an inclusive date range (unchanged route, extended item shape)
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Newest-first collection; empty is an array
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SportActivity'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      summary: Record a sport, manual or imported, and preserve date participation atomically
      description: >
        Requires Idempotency-Key equal to operation_key. A verbatim retry replays 201. When source is
        not manual and an activity with the same source and external_id already exists for the
        athlete, the existing activity is returned with 200 and nothing is written.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSportActivityRequest'}}}
      responses:
        '201':
          description: Created, or identical idempotent replay
          content: {application/json: {schema: {$ref: '#/components/schemas/SportActivity'}}}
        '200':
          description: Existing activity for this athlete, source, and external_id; no side effect
          content: {application/json: {schema: {$ref: '#/components/schemas/SportActivity'}}}
        '409': {$ref: '#/components/responses/ConflictError'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /api/v1/sport-activities/{id}:
    get:
      summary: Get one owned sport activity (unchanged route, extended shape)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Owned activity, content: {application/json: {schema: {$ref: '#/components/schemas/SportActivity'}}}}
        '404': {description: Missing and foreign IDs are indistinguishable}
components:
  schemas:
    ActivitySource:
      type: string
      enum: [manual, apple_health]
      description: Origin of the activity. Omitted on create means manual.
    CreateSportActivityRequest:
      type: object
      required: [sport_id, sport_name, duration_minutes, operation_key]
      properties:
        date: {type: string, format: date, description: Athlete-local civil date; defaults to today; future rejected}
        sport_id: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 64}
        sport_name: {type: string, minLength: 1, maxLength: 80}
        duration_minutes: {type: integer, minimum: 1, maximum: 1440}
        notes: {type: string, maxLength: 2000, nullable: true}
        operation_key: {type: string, minLength: 1, maxLength: 128}
        source: {$ref: '#/components/schemas/ActivitySource'}
        external_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Required when source is not manual; forbidden when it is. Health store identity of the workout.
        distance_meters: {type: integer, minimum: 1, maximum: 1000000, nullable: true}
        energy_kcal: {type: integer, minimum: 1, maximum: 20000, nullable: true}
        avg_heart_rate_bpm: {type: integer, minimum: 30, maximum: 250, nullable: true}
    SportActivity:
      type: object
      required: [id, date, sport_id, sport_name, duration_minutes, source, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        sport_id: {type: string}
        sport_name: {type: string}
        duration_minutes: {type: integer}
        notes: {type: string, nullable: true}
        source: {$ref: '#/components/schemas/ActivitySource'}
        external_id: {type: string, description: Present only for imported activities}
        distance_meters: {type: integer, description: Present only when supplied}
        energy_kcal: {type: integer, description: Present only when supplied}
        avg_heart_rate_bpm: {type: integer, description: Present only when supplied}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error, code, details]
      properties:
        error: {type: string}
        code: {type: string, enum: [VALIDATION_ERROR, NOT_FOUND, IDEMPOTENCY_CONFLICT]}
        details: {type: object, nullable: true}
  responses:
    ValidationError:
      description: Field-level validation failure; details.field names the offending field (source, external_id, distance_meters, energy_kcal, avg_heart_rate_bpm, date, duration_minutes, sport_id, sport_name, notes, operation_key)
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ConflictError:
      description: Same operation_key with a different payload
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
